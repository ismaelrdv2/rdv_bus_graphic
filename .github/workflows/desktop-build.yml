name: RDV Bus Studio Desktop — AppImage e Windows EXE

# Modo economia (23/11/2026): nenhuma compilação por push, PR ou tag.
# Compilações prioritárias: RDV-Build-Server-Private (runner Debian rdv-debian13).
# Este workflow hospedado somente pode ser iniciado manualmente pelo proprietário.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    name: Linux x86_64 — AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Dependências de sistema do Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Testar curvas de animação originais aprovadas
        run: npm run test:legacy
      - name: Testar formatos TV e rodapés editáveis
        run: npm run test:broadcast
      - name: Testar verificação segura das atualizações
        run: npm run test:updates
      - name: Testar reorganização do Texto Livre
        run: npm run test:consolidation
      - name: Testar modos de exportação alfa e Chroma Key
        run: npm run test:export
      - name: Verificar Svelte e TypeScript
        run: npm run check
      - name: Compilar AppImage
        run: npm run desktop:build -- --bundles appimage
      - name: Publicar AppImage de teste
        uses: actions/upload-artifact@v4
        with:
          name: RDV-Bus-Studio-Desktop-alpha9.3.12-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Windows x64 — NSIS e executável de teste
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Testar curvas de animação originais aprovadas
        run: npm run test:legacy
      - name: Testar formatos TV e rodapés editáveis
        run: npm run test:broadcast
      - name: Testar verificação segura das atualizações
        run: npm run test:updates
      - name: Testar reorganização do Texto Livre
        run: npm run test:consolidation
      - name: Testar modos de exportação alfa e Chroma Key
        run: npm run test:export
      - name: Verificar Svelte e TypeScript
        run: npm run check
      - name: Compilar instalador NSIS
        run: npm run desktop:build -- --bundles nsis
      - name: Publicar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: RDV-Bus-Studio-Desktop-alpha9.3.12-Windows-Instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publicar executável Windows sem instalador (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: RDV-Bus-Studio-Desktop-alpha9.3.12-Windows-EXE-Direto
          path: src-tauri/target/release/rdv-bus.exe
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publicar pacotes aprovados para guia Atualizações
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [linux-appimage, windows-exe]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar tag da versão e código da main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || { echo "Tag diferente da versão $EXPECTED"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "A tag não foi criada a partir da main"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: RDV-Bus-Studio-Desktop-alpha9.3.12-Linux-AppImage
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: RDV-Bus-Studio-Desktop-alpha9.3.12-Windows-Instalador
          path: release-assets/windows
      - name: Publicar Release oficial com binários das duas plataformas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find release-assets/linux -type f -name '*.AppImage' -print -quit)"
          INSTALLER="$(find release-assets/windows -type f -iname '*setup*.exe' -print -quit)"
          test -s "$APPIMAGE" || { echo "AppImage não encontrado"; exit 1; }
          test -s "$INSTALLER" || { echo "Instalador NSIS não encontrado"; exit 1; }
          echo "$(sha256sum "$APPIMAGE" | cut -d' ' -f1)  $(basename "$APPIMAGE")" > SHA256SUMS.txt
          echo "$(sha256sum "$INSTALLER" | cut -d' ' -f1)  $(basename "$INSTALLER")" >> SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$APPIMAGE" "$INSTALLER" SHA256SUMS.txt --verify-tag --title "RDV Bus Studio Desktop ${GITHUB_REF_NAME#v}" --prerelease --generate-notes
